<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wall · Anthropocene v4 (Living Timeline Edition)</title>
<style>
:root {
  --bg: #f5f4f1;
  --ink: #0a0908;
  --rule: #ececea;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: var(--bg); font-family: 'Avenir Next', sans-serif; cursor: none;
}
canvas#wall { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }

#hud {
  position: fixed; top: 8px; right: 8px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--rule);
  font-size: 10px; color: var(--ink);
  padding: 8px 12px;
  font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
  z-index: 100; display: none; font-weight: 500; line-height: 1.4;
}
#hud.visible { display: block; }
#hud .lbl { color: #8a857e; text-transform: uppercase; font-size: 9px; letter-spacing: 0.2em; }
#hud .val { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>

<canvas id="wall"></canvas>

<div id="hud">
  <div><span class="lbl">FPS</span> <span class="val" id="hud-fps">—</span></div>
  <div><span class="lbl">Particles</span> <span class="val" id="hud-particles">—</span></div>
  <div><span class="lbl">Active states</span> <span class="val" id="hud-active">—</span></div>
  <div><span class="lbl">Time</span> <span class="val" id="hud-show">00:00</span></div>
  <div><span class="lbl">DPR</span> <span class="val" id="hud-dpr">—</span></div>
</div>

<script>
// =================================================================
// DATASET
// =================================================================
const ANCHORS = {
  co2:       {1800:0.03, 1820:0.05, 1850:0.20, 1870:0.50, 1880:0.80, 1890:1.20, 1900:1.95, 1913:3.40, 1929:4.10, 1932:3.30, 1939:4.20, 1945:4.20, 1950:5.95, 1960:9.40, 1970:14.85, 1980:19.45, 1990:22.50, 2000:25.45, 2010:33.70, 2019:37.10, 2020:35.40, 2023:37.40},
  coal:      {1800:0.015, 1850:0.085, 1900:0.78, 1913:1.34, 1929:1.55, 1932:1.10, 1950:1.83, 1960:2.55, 1970:2.93, 1980:3.78, 1990:4.69, 2000:4.65, 2010:7.30, 2013:8.19, 2020:7.70, 2023:8.70},
  steel:     {1800:0.05, 1850:0.25, 1880:4.0, 1900:28.0, 1913:76.0, 1929:121.0, 1932:51.0, 1945:113.0, 1950:189.0, 1960:346.0, 1970:595.0, 1980:717.0, 1990:770.0, 2000:851.0, 2010:1433.0, 2014:1670.0, 2020:1864.0, 2023:1892.0},
  cement:    {1800:0.0, 1850:0.0005, 1900:0.012, 1929:0.055, 1932:0.040, 1950:0.133, 1970:0.580, 1980:0.884, 1990:1.160, 2000:1.660, 2010:3.310, 2014:4.180, 2023:4.10},
  aluminium: {1800:0.0, 1886:0.00003, 1900:0.0073, 1929:0.273, 1932:0.155, 1950:1.51, 1960:4.55, 1970:9.65, 1980:16.0, 1990:19.4, 2000:24.5, 2010:41.4, 2020:65.3, 2023:70.59},
  plastic:   {1800:0.0, 1907:0.001, 1950:2.0, 1960:8.0, 1970:35, 1980:70, 1990:120, 2000:213, 2010:280, 2018:460, 2020:367, 2023:413},
  synthN:    {1800:0.0, 1913:0.005, 1929:1.20, 1950:4.0, 1960:11.5, 1970:32.0, 1980:60.0, 1990:78.0, 2000:86.0, 2010:105.0, 2019:123.0, 2023:120.0},
  phosphate: {1800:0.0, 1842:0.001, 1900:0.50, 1929:2.10, 1950:6.5, 1970:22.0, 1980:32.0, 1990:35.0, 2000:32.0, 2010:39.0, 2019:47.0, 2023:45.7},
  so2:       {1800:1.0, 1850:4.4, 1900:26, 1929:65, 1950:95, 1970:143, 1980:152, 1990:121, 2000:110, 2005:140, 2010:110, 2020:85, 2023:50},
  cfcs:      {1800:0.0, 1928:0.001, 1950:25, 1960:130, 1970:700, 1985:1050, 1988:1150, 1990:950, 2000:200, 2010:35, 2020:18, 2023:15},
  ddt:       {1800:0.0, 1939:0.001, 1945:5, 1950:25, 1962:82, 1963:82, 1972:50, 1980:30, 1990:15, 2000:8, 2010:4.0, 2020:1.5, 2023:0.31},
  mercury:   {1800:600, 1850:700, 1879:2200, 1900:2000, 1920:2400, 1950:2200, 1970:2200, 1980:2300, 1990:2000, 2000:1900, 2010:2100, 2015:2220, 2023:2500},
  lead:      {1800:30, 1850:80, 1900:220, 1929:290, 1932:200, 1950:280, 1970:380, 1980:440, 1990:250, 2000:130, 2010:80, 2021:60, 2023:50},
  methane:   {1800:60, 1850:80, 1900:110, 1929:150, 1950:180, 1970:280, 1980:320, 1990:340, 2000:350, 2010:365, 2020:395, 2023:400},
  pfas:      {1800:0.0, 1938:0.0, 1947:0.05, 1950:0.1, 1960:0.5, 1970:2, 1980:5, 1990:10, 2000:17, 2002:14, 2010:11, 2015:13, 2020:16, 2023:17},
};
const UPP = { co2:0.5, methane:10, pfas:0.5, coal:0.05, cement:0.025, steel:10, aluminium:0.5, plastic:2.5, synthN:1.0, phosphate:0.5, mercury:25, so2:1.0, lead:2.5, cfcs:25, ddt:2.5 };
const MATERIALS = ['co2','methane','pfas','coal','cement','steel','aluminium','plastic','synthN','phosphate','mercury','so2','lead','cfcs','ddt'];
const PALETTE = {
  co2: '#b8341c', methane: '#42a5f5', pfas: '#9c27b0',
  coal: '#1a1a1a', cement: '#c9b98a', steel: '#7a8a9a',
  aluminium: '#a8d4e8', plastic: '#e91e63', synthN: '#7cb342',
  phosphate: '#ffb300', mercury: '#5d4037', so2: '#8b6f3d',
  lead: '#1d4e89', cfcs: '#00897b', ddt: '#e8814a',
};

function interp(anchors, year) {
  const ys = Object.keys(anchors).map(Number).sort((a,b)=>a-b);
  if (year <= ys[0]) return anchors[ys[0]];
  if (year >= ys[ys.length-1]) return anchors[ys[ys.length-1]];
  for (let i=0; i<ys.length-1; i++) {
    if (year >= ys[i] && year <= ys[i+1]) {
      const t = (year - ys[i]) / (ys[i+1] - ys[i]);
      return anchors[ys[i]] + t * (anchors[ys[i+1]] - anchors[ys[i]]);
    }
  }
  return 0;
}
function particleMixForYear(year) {
  const mix = {};
  for (const m of MATERIALS) mix[m] = Math.round(interp(ANCHORS[m], year) / UPP[m]);
  return mix;
}

// =================================================================
// CONFIG
// =================================================================
const PARAMS = new URLSearchParams(location.search);
const SHOW_HUD = PARAMS.has('hud');
const RECORD_MODE = PARAMS.has('record'); 

const DPR_CAP = (() => {
  const override = PARAMS.get('dpr');
  if (override !== null) return Math.min(parseFloat(override) || 1, 8);
  return Math.min(window.devicePixelRatio || 1, 4);
})();
const PERF_SCALE = (() => {
  const v = PARAMS.get('perf');
  if (v === 'low') return 0.5;
  if (v === 'medium') return 0.75;
  return 1.0;
})();

const ROWS = 8, COLS = 28, GAP = 2; 

const PERSP_FOCAL = 0.85;
const PERSP_ZDEPTH = 0.8;
function perspectiveScale(z) {
  return PERSP_FOCAL / (PERSP_FOCAL + z * PERSP_ZDEPTH);
}

// =================================================================
// PARTICLE
// =================================================================
class Particle {
  constructor(material, index) {
    this.idx = index; 
    this.material = material;
    this.x = 0; this.y = 0;
    
    // (-50% Translational Velocity and drift)
    this.vx = (Math.random() - 0.5) * 0.1;
    this.vy = (Math.random() - 0.5) * 0.1;
    this.phaseA = Math.random() * Math.PI * 2;
    this.phaseB = Math.random() * Math.PI * 2;
    this.phaseC = Math.random() * Math.PI * 2;
    this.freqA = 0.00020 + Math.random() * 0.00035;
    this.freqB = 0.00025 + Math.random() * 0.00035;
    this.freqC = 0.00015 + Math.random() * 0.00025;
    
    this.wanderAmp = 0.3 + Math.random() * 0.4; 
    this.gravityFactor = 0.85 + Math.random() * 0.30;
    
    this.dartVx = (Math.random() - 0.5) * 0.25;
    this.dartVy = (Math.random() - 0.5) * 0.25;
    this.dartInterval = 200 + Math.floor(Math.random() * 300);
    this.dartT = Math.floor(Math.random() * this.dartInterval);
    
    // RESTORED TO ORIGINAL: Exact particle size untouched
    this.size = 2 + Math.random() * 2; 
    
    // Z-depth pulsing (-50% speed)
    this.z = Math.random();
    this.zv = (Math.random() - 0.5) * 0.00055;
    
    this.rotX = Math.random() * Math.PI;
    this.rotY = Math.random() * Math.PI;
    
    // RESTORED TO ORIGINAL: Tumble rotation completely untouched
    this.rsX = (Math.random() - 0.5) * 0.02;
    this.rsY = (Math.random() - 0.5) * 0.02;
  }
}

// =================================================================
// CELL
// =================================================================
const STATE = { IDLE: 'idle', BREATHE: 'breathe', VORTEX: 'vortex', SPIRAL: 'spiral', SWARM: 'swarm', HAHA: 'haha' };

class Cell {
  constructor(year, gridX, gridY) {
    this.year = year; this.gridX = gridX; this.gridY = gridY;
    this.x = 0; this.y = 0; this.w = 0; this.h = 0;
    
    const mix = particleMixForYear(year);
    this.particles = [];
    let idx = 0;
    for (const m of MATERIALS) {
      const count = Math.round(mix[m] * PERF_SCALE);
      for (let i = 0; i < count; i++) this.particles.push(new Particle(m, idx++));
    }
    this.particleCount = this.particles.length;
    
    this.state = STATE.IDLE;
    this.stateStarted = 0;
    this.stateDuration = 0;
    this.formationProgress = 0;
    
    this.nextMicroEventAt = 5000 + Math.random() * 20000;
  }
  
  layout(x, y, w, h) {
    const firstTime = (this.w === 0);
    this.x = x; this.y = y; this.w = w; this.h = h;
    if (firstTime) {
      for (const p of this.particles) {
        p.x = Math.random() * w;
        p.y = Math.random() * h;
      }
    }
  }
  
  enterState(newState, duration = 0, now = 0) {
    this.state = newState;
    this.stateStarted = now;
    this.stateDuration = Math.max(duration, 5000); 
    this.formationProgress = 0;
  }
  
  formationEase(t) {
    if (t < 0.25) { const u = t / 0.25; return u * u * (3 - 2 * u); }
    if (t > 0.75) { const u = (1 - t) / 0.25; return u * u * (3 - 2 * u); }
    return 1.0;
  }
}

// =================================================================
// WALL & ORCHESTRATOR
// =================================================================
class Wall {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.cells = [];
    for (let i = 0; i < 224; i++) {
      const gridX = i % COLS;
      const gridY = Math.floor(i / COLS);
      this.cells.push(new Cell(1800 + i, gridX, gridY));
    }
    this.totalParticles = this.cells.reduce((s, c) => s + c.particleCount, 0);
    
    this.frameCount = 0;
    this.fps = 0;
    this.activeStates = 0;
    this.internalClock = 0;
    this.startTime = performance.now(); 
    this.globalEnergy = 1.0;
    
    this.animationDuration = 10 * 60 * 1000; 
    this.lastCycleTime = 0;
    this.timelineIdx = 0;
    this.generateTimeline();
    
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }
  
  generateTimeline() {
    this.timeline = [];
    const END_TIME = this.animationDuration - 5000;
    
    let t = 2000; 
    const waves = ['waveBreathe', 'globalSpiral', 'waveVortex', 'globalSwarm', 'globalHaha'];
    
    while (t < END_TIME) {
      const type = waves[Math.floor(Math.random() * waves.length)];
      const duration = 8000 + Math.random() * 6000; 
      this.timeline.push({ time: t, type, duration });
      t += duration + 10000 + Math.random() * 10000; 
    }
  }

  executeEvent(ev, now) {
    const stMap = {
      'globalSpiral': STATE.SPIRAL,
      'globalSwarm': STATE.SWARM,
      'globalHaha': STATE.HAHA
    };
    
    if (stMap[ev.type]) {
      for (const c of this.cells) {
        c.enterState(stMap[ev.type], ev.duration, now);
        c.nextMicroEventAt = now + ev.duration + 12000 + Math.random() * 12000;
      }
    } else if (ev.type.startsWith('wave')) {
      const typeStr = ev.type.replace('wave', '').toLowerCase();
      this.triggerWave(typeStr, ev.duration, 150, now); 
    }
  }

  triggerWave(action, duration, staggerMs, baseTime) {
    for (let col = 0; col < COLS; col++) {
      const triggerTime = baseTime + (col * staggerMs);
      
      for (let row = 0; row < ROWS; row++) {
        const cell = this.cells[row * COLS + col];
        if (!cell) continue;
        
        let st;
        if (action === 'breathe') st = STATE.BREATHE;
        else if (action === 'vortex') st = STATE.VORTEX;
        else if (action === 'haha') st = STATE.HAHA;
        
        if (st) {
          cell.enterState(st, duration, triggerTime);
          cell.nextMicroEventAt = triggerTime + duration + 12000 + Math.random() * 12000;
        }
      }
    }
  }

  resize() {
    const dpr = DPR_CAP;
    this.dpr = dpr;
    const cssW = window.innerWidth, cssH = window.innerHeight;
    this.canvas.width = Math.round(cssW * dpr);
    this.canvas.height = Math.round(cssH * dpr);
    this.canvas.style.width = cssW + 'px';
    this.canvas.style.height = cssH + 'px';
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.scale(dpr, dpr);
    
    const totalGapX = GAP * (COLS - 1);
    const totalGapY = GAP * (ROWS - 1);
    
    const cellFromW = (cssW - totalGapX) / COLS;
    const cellFromH = (cssH - totalGapY) / ROWS;
    const cellSize = Math.min(cellFromW, cellFromH);
    const cellW = cellSize, cellH = cellSize;
    
    const gridW = cellSize * COLS + totalGapX;
    const gridH = cellSize * ROWS + totalGapY;
    const originX = (cssW - gridW) / 2;
    const originY = (cssH - gridH) / 2;
    
    for (const c of this.cells) {
      const x = originX + c.gridX * (cellW + GAP);
      const y = originY + c.gridY * (cellH + GAP);
      c.layout(x, y, cellW, cellH);
    }
    this.cssW = cssW;
    this.cssH = cssH;
    
    this.bgCanvas = document.createElement('canvas');
    this.bgCanvas.width = Math.round(cssW * dpr);
    this.bgCanvas.height = Math.round(cssH * dpr);
    const bgCtx = this.bgCanvas.getContext('2d');
    bgCtx.scale(dpr, dpr);
    bgCtx.fillStyle = '#f5f4f1';
    bgCtx.fillRect(0, 0, cssW, cssH);
    for (const c of this.cells) {
      bgCtx.fillStyle = '#fafaf8';
      bgCtx.fillRect(c.x, c.y, c.w, c.h);
      bgCtx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
      bgCtx.lineWidth = 1;
      bgCtx.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);
      const g = bgCtx.createLinearGradient(c.x, c.y, c.x + c.w * 0.7, c.y + c.h * 0.45);
      g.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      g.addColorStop(1, 'rgba(255, 255, 255, 0)');
      bgCtx.fillStyle = g;
      bgCtx.fillRect(c.x, c.y, c.w * 0.7, c.h * 0.45);
    }
    if (SHOW_HUD) document.getElementById('hud-dpr').textContent = dpr.toFixed(2);
  }
  
  updateCell(cell, now) {
    if (cell.state !== STATE.IDLE && cell.stateStarted <= now) {
      const elapsed = now - cell.stateStarted;
      if (elapsed >= cell.stateDuration) {
        cell.state = STATE.IDLE;
        cell.nextMicroEventAt = now + 12000 + Math.random() * 13000;
      } else {
        cell.formationProgress = elapsed / cell.stateDuration;
      }
    }

    if (cell.state === STATE.IDLE && now > cell.nextMicroEventAt) {
      const micro = [STATE.BREATHE, STATE.VORTEX, STATE.SPIRAL, STATE.SWARM];
      const ev = micro[Math.floor(Math.random() * micro.length)];
      cell.enterState(ev, 6000 + Math.random() * 4000, now); 
    }
    
    const cellW = cell.w, cellH = cell.h;
    const cx = cellW / 2, cy = cellH / 2;
    const cellMin = Math.min(cellW, cellH);
    
    // Physics (-50% speed exactly)
    const ACCEL = 0.0025 * this.globalEnergy; 
    const DAMPING = 0.994; 
    const MAX_SPEED = 0.5 * this.globalEnergy; 
    
    const EDGE_MARGIN_FRAC = 0.08; 
    const EDGE_REPULSION = 0.075 * this.globalEnergy; 
    const edgeMargin = cellMin * EDGE_MARGIN_FRAC;

    let tumbleBoost = cell.state === STATE.HAHA ? 3.0 : 1.0;
    const eased = (cell.state !== STATE.IDLE && cell.stateStarted <= now) ? cell.formationEase(cell.formationProgress) : 0;

    for (const p of cell.particles) {
      let ax = 0, ay = 0;
      
      p.dartT++;
      if (p.dartT >= p.dartInterval) {
        p.dartT = 0;
        p.dartVx = (Math.random() - 0.5) * 0.25; 
        p.dartVy = (Math.random() - 0.5) * 0.25;
      }
      
      const DART_EASE = 0.005 * this.globalEnergy;
      p.vx += (p.dartVx - p.vx) * DART_EASE;
      p.vy += (p.dartVy - p.vy) * DART_EASE;
      
      ax += Math.sin(this.internalClock * p.freqA + p.phaseA) * p.wanderAmp * 0.1;
      ay += Math.cos(this.internalClock * p.freqB + p.phaseB) * p.wanderAmp * 0.1;

      if (p.x < edgeMargin) { ax += Math.pow(1 - p.x / edgeMargin, 3) * EDGE_REPULSION; }
      else if (p.x > cellW - edgeMargin) { ax -= Math.pow(1 - (cellW - p.x) / edgeMargin, 3) * EDGE_REPULSION; }
      if (p.y < edgeMargin) { ay += Math.pow(1 - p.y / edgeMargin, 3) * EDGE_REPULSION; }
      else if (p.y > cellH - edgeMargin) { ay -= Math.pow(1 - (cellH - p.y) / edgeMargin, 3) * EDGE_REPULSION; }

      p.vx = (p.vx + ax * ACCEL) * DAMPING;
      p.vy = (p.vy + ay * ACCEL) * DAMPING;
      
      const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (speed > MAX_SPEED) {
        p.vx = (p.vx / speed) * MAX_SPEED;
        p.vy = (p.vy / speed) * MAX_SPEED;
      }
      
      let physX = p.x + p.vx;
      let physY = p.y + p.vy;
      const m = p.size * 1.5; 
      const BOUNCE = 0.85;
      
      if (physX < m) { physX = m; p.vx = Math.abs(p.vx) * BOUNCE; }
      else if (physX > cellW - m) { physX = cellW - m; p.vx = -Math.abs(p.vx) * BOUNCE; }
      if (physY < m) { physY = m; p.vy = Math.abs(p.vy) * BOUNCE; }
      else if (physY > cellH - m) { physY = cellH - m; p.vy = -Math.abs(p.vy) * BOUNCE; }
      
      let tx = physX, ty = physY; 
      
      if (eased > 0) {
        const N = cell.particleCount;
        const timeFactor = this.internalClock;
        
        switch (cell.state) {
          case STATE.SPIRAL: {
            const goldenAngle = 2.39996; 
            const theta = p.idx * goldenAngle + timeFactor * 0.001 * this.globalEnergy;
            const maxRadius = cellMin * 0.46; 
            const radius = Math.sqrt(p.idx / N) * maxRadius;
            tx = cx + Math.cos(theta) * radius;
            ty = cy + Math.sin(theta) * radius;
            break;
          }
          case STATE.BREATHE: {
            const ringIdx = p.idx % 3;
            const theta = (p.idx / N) * Math.PI * 2 * 3 + timeFactor * 0.0005 * (ringIdx % 2 === 0 ? 1 : -1);
            const baseRadius = (ringIdx + 1) * (cellMin * 0.14);
            const pulse = 1 + 0.3 * Math.sin(timeFactor * 0.003 * this.globalEnergy + ringIdx);
            tx = cx + Math.cos(theta) * baseRadius * pulse;
            ty = cy + Math.sin(theta) * baseRadius * pulse;
            break;
          }
          case STATE.VORTEX: {
            const depth = p.z; 
            const theta = p.idx * 0.5 + timeFactor * (0.0075 + depth * 0.01) * this.globalEnergy; 
            const radius = cellMin * 0.46 * (1 - depth * 0.8); 
            tx = cx + Math.cos(theta) * radius;
            ty = cy + Math.sin(theta) * radius;
            break;
          }
          case STATE.SWARM: {
            const sx = cx + Math.sin(timeFactor * 0.0025 + cell.gridX) * cellW * 0.25; 
            const sy = cy + Math.cos(timeFactor * 0.003 + cell.gridY) * cellH * 0.25;
            const theta = p.idx * 1.1 + timeFactor * 0.004 * this.globalEnergy;
            const radius = (p.idx % 6 + 1) * 3.0; 
            tx = sx + Math.cos(theta) * radius;
            ty = sy + Math.sin(theta) * radius;
            break;
          }
          case STATE.HAHA: {
            const radius = cellMin * 0.25 + Math.sin(timeFactor * 0.005 + p.idx) * cellMin * 0.1;
            const theta = p.idx * 0.1 + timeFactor * 0.015 * this.globalEnergy;
            tx = cx + Math.cos(theta) * radius;
            ty = cy + Math.sin(theta * 2) * radius * 0.5; 
            break;
          }
        }
        
        tx = Math.max(m, Math.min(cellW - m, tx));
        ty = Math.max(m, Math.min(cellH - m, ty));
        
        p.x = physX * (1 - eased) + tx * eased;
        p.y = physY * (1 - eased) + ty * eased;
      } else {
        p.x = physX;
        p.y = physY;
      }

      p.x = Math.max(m, Math.min(cellW - m, p.x));
      p.y = Math.max(m, Math.min(cellH - m, p.y));
      
      p.z += p.zv;
      if (p.z < 0) { p.z = 0; p.zv = -p.zv; }
      else if (p.z > 1) { p.z = 1; p.zv = -p.zv; }

      p.rotX += p.rsX * tumbleBoost;
      p.rotY += p.rsY * tumbleBoost;
    }
  }
  
  drawCell(cell, ctx) {
    const cx = cell.x, cy = cell.y;
    const isHaha = cell.state === STATE.HAHA;
    const ps = cell.particles;
    const n = ps.length;

    let ordArr = cell._drawOrderArr;
    if (!ordArr || ordArr.length !== n) {
      ordArr = cell._drawOrderArr = new Array(n);
      for (let i = 0; i < n; i++) ordArr[i] = i;
    }
    ordArr.sort((a, b) => ps[b].z - ps[a].z);

    for (let k = 0; k < n; k++) {
      const p = ps[ordArr[k]];

      let color;
      if (isHaha) {
        const idx = ((p.rotX * 2 + p.rotY * 2) | 0);
        color = PALETTE[MATERIALS[((idx % 15) + 15) % 15]];
      } else {
        color = PALETTE[p.material];
      }

      const intensity = Math.abs(Math.cos(p.rotY));
      const drawSize = p.size * perspectiveScale(p.z);
      const half = drawSize / 2;

      ctx.save();
      ctx.translate(cx + p.x, cy + p.y);
      ctx.rotate(p.rotX);

      ctx.globalAlpha = 0.4 + intensity * 0.6;
      ctx.fillStyle = color;
      ctx.fillRect(-half, -half, drawSize, drawSize);

      if (intensity > 0.85) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(-half, -half, drawSize, drawSize);
      }
      ctx.restore();
    }
  }
  
  draw() {
    const ctx = this.ctx;
    ctx.globalAlpha = 1;
    ctx.drawImage(this.bgCanvas, 0, 0, this.cssW, this.cssH);
    
    let active = 0;
    for (const cell of this.cells) {
      if (cell.state !== STATE.IDLE) active++;
      this.drawCell(cell, ctx);
    }
    this.activeStates = active;
    ctx.globalAlpha = 1;
  }
  
  step() {
    if (RECORD_MODE) {
      this.internalClock += (1000 / 60); 
    } else {
      this.internalClock = performance.now() - this.startTime;
    }

    const now = this.internalClock;
    
    // Global Energy Modulation frequency halved for slower transitions
    this.globalEnergy = 0.875 + 0.275 * Math.sin(now * 0.000075);

    const cycleTimeMs = now % this.animationDuration; 
    
    if (cycleTimeMs < this.lastCycleTime) {
      this.timelineIdx = 0;
      this.generateTimeline(); 
    }
    this.lastCycleTime = cycleTimeMs;
    
    while (this.timelineIdx < this.timeline.length && cycleTimeMs >= this.timeline[this.timelineIdx].time) {
      this.executeEvent(this.timeline[this.timelineIdx], now);
      this.timelineIdx++;
    }
    
    for (const cell of this.cells) this.updateCell(cell, now);
    this.draw();
    
    this.frameCount++;
    if (!RECORD_MODE) {
       const realNow = performance.now();
       if (!this._lastFpsTime) this._lastFpsTime = realNow;
       if (realNow - this._lastFpsTime >= 1000) {
         this.fps = this.frameCount;
         this.frameCount = 0;
         this._lastFpsTime = realNow;
         if (SHOW_HUD) {
           document.getElementById('hud-fps').textContent = this.fps;
           document.getElementById('hud-particles').textContent = this.totalParticles.toLocaleString();
           document.getElementById('hud-active').textContent = this.activeStates;
           const m = Math.floor(cycleTimeMs / 60000);
           const s = Math.floor((cycleTimeMs / 1000) % 60);
           document.getElementById('hud-show').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
         }
       }
    }
  }
}

// Global hooks for headless recording
window.wall = null;
window.renderNextFrame = async () => {
  window.wall.step();
  return window.wall.canvas.toDataURL('image/jpeg', 0.95);
};

window.addEventListener('DOMContentLoaded', () => {
  window.wall = new Wall(document.getElementById('wall'));
  if (SHOW_HUD) document.getElementById('hud').classList.add('visible');
  
  if (!RECORD_MODE) {
    function loop() { window.wall.step(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  }
});
</script>
